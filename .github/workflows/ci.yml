name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build
      - name: Publish Windows test build
        run: dotnet publish src/FMOpenEditor.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish/FMOpenEditor
      - name: Copy data folders
        shell: pwsh
        run: |
          Copy-Item LICENSE publish/FMOpenEditor/
      - name: Upload Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: FMOpenEditor-FM27-Console-name-test
          path: publish/FMOpenEditor/
